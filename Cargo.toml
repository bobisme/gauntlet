[workspace]
members = ["crates/scourge-core", "fixtures/target"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

# M0 deliberately pins crates before the product members that consume them
# land; scripts/check-dependency-pins.py owns that temporary unused set.
[workspace.lints.cargo]
unused_workspace_dependencies = "allow"

# M0.1 dependency contract. Every third-party crate is pinned exactly here;
# members select only the features they use. See docs/dependencies.md.
[workspace.dependencies]
scourge-core = { path = "crates/scourge-core" }
axum = "=0.8.9"
clap = "=4.6.8"
flate2 = "=1.1.11"
futures-util = "=0.3.34"
http-body-util = "=0.1.5"
rusqlite = { version = "=0.43.0", default-features = false, features = ["backup", "bundled", "cache"] }
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "process", "std"] }
schemars = "=1.2.3"
serde = "=1.0.229"
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
time = "=0.3.55"
tokio = "=1.54.1"
toml = "=1.2.1"
tower = "=0.5.3"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "std"] }
uuid = "=1.29.3"
