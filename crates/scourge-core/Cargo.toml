[package]
name = "scourge-core"
version.workspace = true
edition.workspace = true
publish = false

[features]
# The hostile-input harness in `fuzz/` inspects captured Teapot replies through
# the adapter's own decoders. Nothing else enables it, and it adds no I/O.
hostile-input = []

[dependencies]
base64.workspace = true
flate2.workspace = true
tempfile.workspace = true
regex = { workspace = true }
rustix = { workspace = true, features = ["rand"] }
rusqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
serde_path_to_error = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing"] }
toml = { workspace = true }
toml_parser = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["event"] }

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }

[dev-dependencies]
axum.workspace = true
scourge-fixture.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync"] }

[lints]
workspace = true
